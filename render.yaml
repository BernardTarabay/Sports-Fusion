# Render blueprint: the API and the worker.
#
# The frontend is NOT here -- it is a static Vite build served by Vercel, which rewrites
# /api/* to whatever host this deploys to. That rewrite is a server-side proxy, so the
# browser only ever sees one origin and the sameSite=strict session cookies keep working.
# Splitting them any other way breaks authentication.
#
# Both services run from the repo root, because backend/ and worker/ are npm workspaces
# and share one lockfile. `npm ci -w <name>` still installs the workspace's dependencies
# from that root lockfile.

services:
  # ---------------------------------------------------------------------------
  # The API
  # ---------------------------------------------------------------------------
  - type: web
    name: sports-fusion-api
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to Lebanon
    branch: main

    buildCommand: npm ci

    # MIGRATE, THEN SERVE.
    #
    # Not a convenience: the API selects columns that migrations add, so a deploy that
    # ships new code against an un-migrated database does not degrade, it 500s on every
    # request. Running it here means the schema is always at least as new as the code
    # that is about to read it.
    #
    # `migrate` is a no-op costing one round trip when there is nothing pending, it
    # applies each file in its own transaction, and it takes a Postgres advisory lock so
    # two instances booting together cannot race. If a migration fails the process exits
    # non-zero, the deploy fails, and Render keeps the previous version serving.
    #
    # Render's pre-deploy hook would be the tidier home for this, but it is a paid-plan
    # feature and this service is on free.
    startCommand: npm run migrate && npm start --workspace=backend

    # Liveness, not readiness. Gating the deploy on /health -- which queries Postgres --
    # meant a database that would not answer showed up as a deploy stuck "in progress"
    # with no error anywhere, because the request never completed and so never logged.
    # /healthz proves the process is up; /health still reports the database, for you.
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production      # turns on secure cookies, sameSite=strict, trust proxy

      # Render injects PORT. config/index.js reads it, so nothing to set.

      # `sync: false` means "prompt me for this, do not store it in git".
      - key: DATABASE_URL
        sync: false            # the POOLED connection string from Vercel Postgres/Neon
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false            # the Vercel domain -- embedded in invite and share links

      # Deliberately tiny. Each instance opens its own pool, and a free Postgres will
      # refuse connections long before it tells you that is what happened -- which
      # surfaces as a health check that fails for no visible reason.
      - key: DATABASE_POOL_MAX
        value: "2"

      # Phone sign-in is OFF until a provider is configured.
      #
      # With none, /api/auth/phone/start answers 503 rather than issuing a code, because
      # the only other options are to send it nowhere or to return it in the response --
      # and returning it means anyone who knows a number owns that account. The seeded
      # admin password still works, so the league is reachable either way.
      #
      # To switch it on: set OTP_PROVIDER=whatsapp with WHATSAPP_PHONE_NUMBER_ID and
      # WHATSAPP_ACCESS_TOKEN, or OTP_PROVIDER=twilio with the Twilio credentials.
      - key: WHATSAPP_ENABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # The worker
  # ---------------------------------------------------------------------------
  #
  # Reminders, waitlist promotions, points awards and notification delivery. The app
  # works without it; those specific things simply never happen.
  #
  # NOTE: Render background workers are not on the free tier. Leave this commented out
  # until you are ready to pay for an instance, or drive `npm run tick` from an external
  # scheduler instead -- the worker is written to support a single pass and exit exactly
  # so it can run that way.
  #
  # - type: worker
  #   name: sports-fusion-worker
  #   runtime: node
  #   plan: starter
  #   region: frankfurt
  #   branch: main
  #   buildCommand: npm ci
  #   startCommand: npm start --workspace=worker
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: JWT_ACCESS_SECRET
  #       sync: false
  #     - key: JWT_REFRESH_SECRET
  #       sync: false
  #     - key: PUBLIC_WEB_URL
  #       sync: false
  #     - key: WHATSAPP_ENABLED
  #       value: "false"
